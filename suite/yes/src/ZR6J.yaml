---
- name: 'The standard json: `%YAML 2.0 json; ---; x: 1`'
  from: part 2, section 10
  tags: str json application quotes
  schema: |
    %YAML 2.0
    --- &
    r:
      x: !str
  root: 'r'
  yaml: |
    %YAML 2.0 json
    ---
    x: 1
  typed: |
    +STR
     +DOC
      +MAP
       =VAL :x
       =VAL :1
      -MAP
     -DOC
    -STR
  json: |
    {"x": "1"}
