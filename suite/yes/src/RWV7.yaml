---
- name: 'Patterns, precision and limits: `!a` on `x: ~; y: [1, ~]`'
  from: part 2, section 10
  tags: int null pattern union double-star
  yaml: |
    %YAML 2.0
    --- &
    a:
      !**: {!|: [!null(/~/), !int]}
    n: !a
    --- !n
    x: ~
    y: [1, ~]
  typed: |
    +STR
     +DOC !n
      +MAP
       =VAL :x
       =NULL
       =VAL :y
       +SEQ
        =INT :1
        =NULL
       -SEQ
      -MAP
     -DOC
    -STR
  json: |
    {"x": null, "y": [1, null]}
