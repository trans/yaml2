---
- name: 'From the third review: `{!|: [!circle, !square]}` on `{kind: square, r: 1}`'
  from: part 2, section 4.4
  tags: int union
  yaml: |
    %YAML 2.0
    --- &
    circle:
      kind: circle
      r: !int
    square:
      kind: square
      r: !int
    shape: {!|: [!circle, !square]}
    --- !shape
    {kind: square, r: 1}
  typed: |
    +STR
     +DOC !shape
      +MAP
       =VAL :kind
       =VAL :square
       =VAL :r
       =INT :1
      -MAP
     -DOC
    -STR
  json: |
    {"kind": "square", "r": 1}
