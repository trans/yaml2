---
- name: 'Quotes in a stream marked quotes or json: `%YAML 2.0 quotes; ---; x: "1"`'
  from: part 2, section 4.1
  tags: str int union application quotes
  schema: |
    %YAML 2.0
    --- &
    r:
      x: {!|: [!int, !str]}
  root: 'r'
  yaml: |
    %YAML 2.0 quotes
    ---
    x: "1"
  typed: |
    +STR
     +DOC
      +MAP
       =VAL :x
       =VAL :1
      -MAP
     -DOC
    -STR
  json: |
    {"x": "1"}
