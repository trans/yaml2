---
- name: 'Who says how to read a document: `!a.example/job` on `retries: 3`'
  from: part 2, section 3
  tags: int application
  schema: |
    %YAML 2.0
    --- &
    job:
      retries: !int
  root: job
  yaml: |
    %YAML 2.0
    --- !a.example/job
    retries: 3
  typed: |
    +STR
     +DOC !a.example/job
      +MAP
       =VAL :retries
       =INT :3
      -MAP
     -DOC
    -STR
  json: |
    {"retries": 3}
