---
- name: Precision, limit and pattern together, example 1
  from: part 2, section 4.7
  tags: spec int decimal pattern range precision sequence
  yaml: |
    %YAML 2.0
    --- &
    percent: !int(0..100 /[-+][0-9]+/)
    cents: !decimal(5:2 0.. /[0-9]+\.[0-9]{2}/)
    row:
      change: !percent
      price: !cents
    --- !row
    change: +5
    price: 19.99
  typed: |
    +STR
     +DOC !row
      +MAP
       =VAL :change
       =INT :5
       =VAL :price
       =DEC :19.99
      -MAP
     -DOC
    -STR
  json: |
    {"change": 5, "price": 19.99}
