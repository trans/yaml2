---
- name: 'Quotes in a stream marked quotes or json: `{!*: !b}` on `a: yes; b: "#t"`'
  from: part 2, section 4.1
  tags: str true words union star
  yaml: |
    %YAML 2.0
    --- &
    b: {!|: [!true(#t|yes), !str]}
    m: {!*: !b}
    --- !m
    a: yes
    b: "#t"
  typed: |
    +STR
     +DOC !m
      +MAP
       =VAL :a
       =BOOL :true
       =VAL :b
       =BOOL :true
      -MAP
     -DOC
    -STR
  json: |
    {"a": true, "b": true}
