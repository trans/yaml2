---
- name: Overview, example 1
  from: part 2, section 1
  tags: spec str int range union
  yaml: |
    %YAML 2.0
    --- &
    job:
      name: !str
      timeout?: !int(0..3600)
      mode: {!|: [fast, safe]}
      steps:
        - run: !str
          retries: !int
        - ...
    --- !job
    name: build
    timeout: 30
    mode: safe
    steps:
      - run: make
        retries: 2
      - run: test
        retries: 0
  typed: |
    +STR
     +DOC !job
      +MAP
       =VAL :name
       =VAL :build
       =VAL :timeout
       =INT :30
       =VAL :mode
       =VAL :safe
       =VAL :steps
       +SEQ
        +MAP
         =VAL :run
         =VAL :make
         =VAL :retries
         =INT :2
        -MAP
        +MAP
         =VAL :run
         =VAL :test
         =VAL :retries
         =INT :0
        -MAP
       -SEQ
      -MAP
     -DOC
    -STR
  json: |
    {"name": "build", "timeout": 30, "mode": "safe", "steps": [{"run": "make", "retries": 2}, {"run": "test", "retries": 0}]}
