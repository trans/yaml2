---
- name: 'A pattern is a plain scalar: `{!str(/x/): !int}` on `x: 1`'
  from: part 2, section 4.3
  tags: str int pattern
  yaml: |
    %YAML 2.0
    --- &
    a: {!str(/x/): !int}
    --- !a
    x: 1
  typed: |
    +STR
     +DOC !a
      +MAP
       =VAL :x
       =INT :1
      -MAP
     -DOC
    -STR
  json: |
    {"x": 1}
