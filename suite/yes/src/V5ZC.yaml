---
- name: Named types, example 1
  from: part 2, section 8
  tags: spec
  yaml: |
    %YAML 2.0
    --- &
    point:
      x: !int
      y: !int
    spot: !point
    ---
    point: {x: 1, y: 2}
    spot: {x: 3, y: 4}
  typed: |
    +STR
     +DOC
      +MAP
       =VAL :point
       +MAP
        =VAL :x
        =VAL :1
        =VAL :y
        =VAL :2
       -MAP
       =VAL :spot
       +MAP
        =VAL :x
        =VAL :3
        =VAL :y
        =VAL :4
       -MAP
      -MAP
     -DOC
    -STR
  json: |
    {"point": {"x": "1", "y": "2"}, "spot": {"x": "3", "y": "4"}}
