---
- name: 'Keys not named: `!a` on `x: {n: 1}`'
  from: part 2, section 10
  tags: double-star reference
  yaml: |
    %YAML 2.0
    --- &
    rules:
      n: !int
    a:
      !**: *rules
    --- !a
    x: {n: 1}
  typed: |
    +STR
     +DOC !a
      +MAP
       =VAL :x
       +MAP
        =VAL :n
        =INT :1
       -MAP
      -MAP
     -DOC
    -STR
  json: |
    {"x": {"n": 1}}
