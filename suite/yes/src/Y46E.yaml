---
- name: 'Typed: `[!str, ...]` on `[*s, *s, *s]`, at a limit of 9'
  from: part 2, section 11
  tags: str sequence reference typed size error
  fail: true
  limit: 9
  keep: true
  yaml: |
    %YAML 2.0
    --- &
    s: abcdefgh
    one: [!str, ...]
    three: [!str(/a.*/), !str(/.*h/), !str(1..)]
    --- !one
    [*s, *s, *s]
