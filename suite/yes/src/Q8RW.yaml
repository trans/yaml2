---
- name: 'Application types: `{x: !int, y: !int}` on `x: 1; y: 2; --- !point; x: 3; y: 4`, binding point'
  from: part 2, section 12
  tags: int bind
  bind: [point]
  calls: [point, point]
  yaml: |
    %YAML 2.0
    --- &
    point: {x: !int, y: !int}
    --- !point
    x: 1
    y: 2
    --- !point
    x: 3
    y: 4
  typed: |
    +STR
     +DOC !point
      +MAP
       =VAL :x
       =INT :1
       =VAL :y
       =INT :2
      -MAP
     -DOC
     +DOC !point
      +MAP
       =VAL :x
       =INT :3
       =VAL :y
       =INT :4
      -MAP
     -DOC
    -STR
  json: |
    {"x": 1, "y": 2}
    {"x": 3, "y": 4}
