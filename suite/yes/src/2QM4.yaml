---
- name: Standard types, example 5
  from: part 2, section 4.1
  tags: spec str int union sequence quotes
  yaml: |
    %YAML 2.0 quotes
    --- &
    port: {!|: [!int, !str]}
    ports: [!port, ...]
    --- !ports
    - 8080
    - "8080"
  typed: |
    +STR
     +DOC !ports
      +SEQ
       =INT :8080
       =VAL :8080
      -SEQ
     -DOC
    -STR
  json: |
    [8080, "8080"]
