    +STR
     +DOC !free
      +MAP
       =VAL :a
       =INT :5
       =VAL :b
       =VAL :5
       =VAL :c
       +SEQ
        =INT :-3
        =VAL :x
       -SEQ
       =VAL :d
       +MAP
        =VAL :e
        +MAP
         =VAL :f
         =INT :7
        -MAP
       -MAP
      -MAP
     -DOC
    -STR
  json: |
    {"a": 5, "b": "5", "c": [-3, "x"], "d": {"e": {"f": 7}}}
