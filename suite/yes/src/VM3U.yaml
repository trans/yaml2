---
- name: Sequences, example 2
  from: part 2, section 6
  tags: spec str int sequence
  yaml: |
    %YAML 2.0
    --- &
    row: [!str, !int, ...]
    rows:
      - !row
      - ...
    --- !rows
    - [a, 1, 2]
    - [b]
  typed: |
    +STR
     +DOC !rows
      +SEQ
       +SEQ
        =VAL :a
        =INT :1
        =INT :2
       -SEQ
       +SEQ
        =VAL :b
       -SEQ
      -SEQ
     -DOC
    -STR
  json: |
    [["a", 1, 2], ["b"]]
