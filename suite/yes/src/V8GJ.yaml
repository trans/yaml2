---
- name: 'Typing a merge: `{<<: *base, y: !int}` on `x: 1; y: 2`'
  from: part 2, section 11
  tags: int merge reference
  yaml: |
    %YAML 2.0
    --- &
    base: {x: !int}
    job: {<<: *base, y: !int}
    --- !job
    x: 1
    y: 2
  typed: |
    +STR
     +DOC !job
      +MAP
       =VAL :x
       =INT :1
       =VAL :y
       =INT :2
      -MAP
     -DOC
    -STR
  json: |
    {"x": 1, "y": 2}
