---
- name: 'Application types: `[!shape, ...]` on `- {x: 1, y: 2}; - target: 3`, binding point and sweep'
  from: part 2, section 12
  tags: int union sequence bind
  bind: [point, sweep]
  calls: [point, sweep]
  yaml: |
    %YAML 2.0
    --- &
    point:
      x: !int
      y: !int
    sweep:
      target: !int
    shape: {!|: [!point, !sweep]}
    shapes: [!shape, ...]
    --- !shapes
    - {x: 1, y: 2}
    - target: 3
  typed: |
    +STR
     +DOC !shapes
      +SEQ
       +MAP
        =VAL :x
        =INT :1
        =VAL :y
        =INT :2
       -MAP
       +MAP
        =VAL :target
        =INT :3
       -MAP
      -SEQ
     -DOC
    -STR
  json: |
    [{"x": 1, "y": 2}, {"target": 3}]
