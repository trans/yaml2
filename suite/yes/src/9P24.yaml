---
- name: 'Application types: `{!|: [!point, !any]}` on `z: {x: 1, y: 2}`, binding point'
  from: part 2, section 12
  tags: int any union bind
  bind: [point]
  calls: []
  yaml: |
    %YAML 2.0
    --- &
    point: {x: !int, y: !int}
    free: {!|: [!point, !any]}
    --- !free
    z: {x: 1, y: 2}
  typed: |
    +STR
     +DOC !free
      +MAP
       =VAL :z
       +MAP
        =VAL :x
        =VAL :1
        =VAL :y
        =VAL :2
       -MAP
      -MAP
     -DOC
    -STR
  json: |
    {"z": {"x": "1", "y": "2"}}
