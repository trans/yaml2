---
- name: 'The standard json: `!cfg` on `extra: {"a": "1", "b": [null]}`'
  from: part 2, section 10
  tags: json quotes
  yaml: |
    %YAML 2.0 quotes
    --- &
    cfg:
      extra: !json
    --- !cfg
    extra: {"a": "1", "b": [null]}
  typed: |
    +STR
     +DOC !cfg
      +MAP
       =VAL :extra
       +MAP
        =VAL :a
        =VAL :1
        =VAL :b
        +SEQ
         =NULL
        -SEQ
       -MAP
      -MAP
     -DOC
    -STR
  json: |
    {"extra": {"a": "1", "b": [null]}}
