    job:
      image: !str
      args?:
        !**: !signed | !str
    --- !job
    image: +5
    args: {n: +5}
  typed: |
    +STR
     +DOC !job
      +MAP
       =VAL :image
       =VAL :+5
       =VAL :args
       +MAP
        =VAL :n
        =INT :5
       -MAP
      -MAP
     -DOC
    -STR
