---
- name: 'Who says how to read a document: `!job` on `retries: abc`'
  from: part 2, section 3
  tags: int any application
  schema: |
    %YAML 2.0
    --- &
    job:
      retries: !int
  root: job
  yaml: |
    %YAML 2.0
    --- &
    job:
      retries: !any
    --- !job
    retries: abc
  typed: |
    +STR
     +DOC !job
      +MAP
       =VAL :retries
       =VAL :abc
      -MAP
     -DOC
    -STR
  json: |
    {"retries": "abc"}
