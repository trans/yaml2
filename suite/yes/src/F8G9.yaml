---
- name: 'Quotes in a stream marked quotes or json: `!m` on `"1": a; 2: b`'
  from: part 2, section 4.1
  tags: str int quotes
  yaml: |
    %YAML 2.0 quotes
    --- &
    m:
      !int: !str
    --- !m
    "1": a
    2: b
  typed: |
    +STR
     +DOC !m
      +MAP
       =VAL :1
       =VAL :a
       =VAL :2
       =VAL :b
      -MAP
     -DOC
    -STR
  json: |
    {"1": "a", "2": "b"}
