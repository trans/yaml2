---
- name: Alternatives, example 5
  from: part 2, section 9
  tags: spec str int union sequence
  yaml: |
    %YAML 2.0
    --- &
    step:
      !|:
        - !str
        - run: !str
          retries?: !int
    steps: [!step, ...]
    --- !steps
    - make
    - {run: test, retries: 2}
