    +STR
     +DOC !steps
      +SEQ
       =VAL :make
       +MAP
        =VAL :run
        =VAL :test
        =VAL :retries
        =INT :2
       -MAP
      -SEQ
     -DOC
    -STR
  json: |
    ["make", {"run": "test", "retries": 2}]
