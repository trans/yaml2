---
- name: 'What a parser holds of a date: `{!|: [!datetime, !str]}` on `2001-02-03T04:05:06x`'
  from: part 2, section 4.8
  tags: str datetime union holds
  holds: 6
  yaml: |
    %YAML 2.0
    --- &
    n: {!|: [!datetime, !str]}
    --- !n
    2001-02-03T04:05:06x
  typed: |
    +STR
     +DOC !n
      =VAL :2001-02-03T04:05:06x
     -DOC
    -STR
  json: |
    "2001-02-03T04:05:06x"
