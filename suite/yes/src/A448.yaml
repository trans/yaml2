---
- name: 'The standard json: `[!int, ...]` on `[1, 2]; ---; [1, "2"]`'
  from: part 2, section 10
  tags: int json sequence quotes
  yaml: |
    %YAML 2.0 json
    --- &
    n: [!int, ...]
    --- !n
    [1, 2]
    ---
    [1, "2"]
  typed: |
    +STR
     +DOC !n
      +SEQ
       =INT :1
       =INT :2
      -SEQ
     -DOC
     +DOC
      +SEQ
       =INT :1
       =VAL :2
      -SEQ
     -DOC
    -STR
  json: |
    [1, 2]
    [1, "2"]
