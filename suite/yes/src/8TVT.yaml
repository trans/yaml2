---
- name: 'Keys not named: `!a` on `k: {x: 1}`'
  from: part 2, section 7
  tags: int star
  yaml: |
    %YAML 2.0
    --- &
    a:
      !*:
        x: !int
    --- !a
    k: {x: 1}
  typed: |
    +STR
     +DOC !a
      +MAP
       =VAL :k
       +MAP
        =VAL :x
        =INT :1
       -MAP
      -MAP
     -DOC
    -STR
  json: |
    {"k": {"x": 1}}
