---
- name: 'Application types: `!job` on `retries: 3`, binding count'
  from: part 2, section 12
  tags: int bind
  bind: [count]
  calls: [count]
  yaml: |
    %YAML 2.0
    --- &
    count: !int
    job:
      retries?: !count
    --- !job
    retries: 3
  typed: |
    +STR
     +DOC !job
      +MAP
       =VAL :retries
       =INT :3
      -MAP
     -DOC
    -STR
  json: |
    {"retries": 3}
