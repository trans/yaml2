---
- name: 'Quotes in a stream marked quotes or json: `!m` on `"a": 1`'
  from: part 2, section 4.1
  tags: int quotes
  yaml: |
    %YAML 2.0 quotes
    --- &
    m:
      a: !int
    --- !m
    "a": 1
  typed: |
    +STR
     +DOC !m
      +MAP
       =VAL :a
       =INT :1
      -MAP
     -DOC
    -STR
  json: |
    {"a": 1}
