  tags: spec str float union double-star
  yaml: |
    %YAML 2.0
    --- &
    circle:
      kind: circle
      r: !float
    square:
      kind: square
      side: !float
    cfg:
      shape: !circle | !square
      !**: !str
    --- !cfg
    shape: {kind: square, side: 2, note: x}
  typed: |
    +STR
     +DOC !cfg
      +MAP
       =VAL :shape
       +MAP
        =VAL :kind
        =VAL :square
        =VAL :side
        =FLT :2.0
        =VAL :note
        =VAL :x
       -MAP
      -MAP
     -DOC
    -STR
  json: |
    {"shape": {"kind": "square", "side": 2.0, "note": "x"}}
