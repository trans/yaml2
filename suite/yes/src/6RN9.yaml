---
- name: 'Quotes in a stream marked quotes or json: `%YAML 2.0 quotes; ---; {"a": 1, "b": "1"}`'
  from: part 2, section 4.1
  tags: quotes
  yaml: |
    %YAML 2.0 quotes
    ---
    {"a": 1, "b": "1"}
  typed: |
    +STR
     +DOC
      +MAP
       =VAL :a
       =VAL :1
       =VAL :b
       =VAL :1
      -MAP
     -DOC
    -STR
  json: |
    {"a": "1", "b": "1"}
