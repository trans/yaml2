---
- name: 'Quotes in a stream marked quotes or json: `{!|: [on, !str]}` on `"on"`'
  from: part 2, section 4.1
  tags: str union quotes
  yaml: |
    %YAML 2.0 quotes
    --- &
    lit: {!|: [on, !str]}
    --- !lit
    "on"
  typed: |
    +STR
     +DOC !lit
      =VAL :on
     -DOC
    -STR
  json: |
    "on"
