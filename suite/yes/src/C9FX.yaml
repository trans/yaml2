---
- name: 'A pattern on !int: `!q | !str` on `5`'
  from: part 2, section 4.5
  tags: str int pattern union sequence
  yaml: |
    %YAML 2.0
    --- &
    q: !int(/[-+][0-9]+/)
    w: !int(/[-+]?[0-9]+/)
    u: !q | !str
    h: !int(/0x[0-9a-f]+/)
    v: !h | !str
    k: !int(/[0-9_]+/)
    ar: !int(/[٠-٩]+/)
    first: !str | !q
    lit: !q | never
    some: !int(/[0-9]*/)
    o:
      a: !some
    mk:
      !q: !str
    by: !bigint | !str
    byi: !int | !str
    --- !u
    5
  typed: |
    +STR
     +DOC !u
      =VAL :5
     -DOC
    -STR
