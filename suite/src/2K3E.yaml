---
- name: A comment after ... and a blank line stops the parser
  from: part 1, section 4.4
  tags: ending comment
  yaml: |
    %YAML 2.0
    ---
    a: x
    ...

    # c
    %YAML 2.0
    # d
    ---
    b: y
  tree: |
    +STR
     +DOC
      +MAP
       =VAL :a
       =VAL :x
      -MAP
     -DOC
    -STR
  json: |
    {"a": "x"}
  rest: |

    # c
    %YAML 2.0
    # d
    ---
    b: y
