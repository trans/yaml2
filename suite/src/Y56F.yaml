- name: LF and CR LF mixed in one stream
  from: part 1, section 3
  tags: character folded
  yaml: |
    %YAML 2.0
    ---←
    a: 1
    b: >←
      x←
      y
  tree: |
    +STR
     +DOC
      +MAP
       =VAL :a
       =VAL :1
       =VAL :b
       =VAL :x y\n
      -MAP
     -DOC
    -STR
  json: |
    {"a": "1", "b": "x y\n"}
