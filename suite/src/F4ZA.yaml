---
- name: 'A tab after <<: in a flow mapping'
  from: part 1, section 9.3
  tags: merge flow whitespace
  yaml: |
    %YAML 2.0
    --- &
    a: {p: 1}
    ---
    m: {<<:»*a}
  tree: |
    +STR
     +DOC
      +MAP
       =VAL :m
       +MAP
        =VAL :p
        =VAL :1
       -MAP
      -MAP
     -DOC
    -STR
  json: |
    {"m": {"p": "1"}}
