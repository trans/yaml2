---
- name: 'Block sequences: a mapping item, a nested one, an empty one and a scalar'
  from: part 1, section 7.2
  tags: sequence empty spec
  yaml: |
    %YAML 2.0
    ---
    - a: 1
      b: 2
    - - x
      - y
    -
    - z
  tree: |
    +STR
     +DOC
      +SEQ
       +MAP
        =VAL :a
        =VAL :1
        =VAL :b
        =VAL :2
       -MAP
       +SEQ
        =VAL :x
        =VAL :y
       -SEQ
       =VAL :
       =VAL :z
      -SEQ
     -DOC
    -STR
  json: |
    [{"a": "1", "b": "2"}, ["x", "y"], "", "z"]
