---
- name: Plain or not, in a flow sequence marked quotes
  from: part 1, section 5
  tags: directive quotes flow
  yaml: |
    %YAML 2.0 quotes
    ---
    [1, "1", '1', a b]
  tree: |
    +STR
     +DOC
      +SEQ
       =VAL :1
       =VAL "1
       =VAL "1
       =VAL :a b
      -SEQ
     -DOC
    -STR
  json: |
    ["1", "1", "1", "a b"]
