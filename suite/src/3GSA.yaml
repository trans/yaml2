---
- name: 'A reference to a table entry that starts with !'
  from: part 1, section 6.1
  tags: table tag reference
  yaml: |
    %YAML 2.0
    --- &
    a: !x
    ...
    --- &
    b: !y
    ---
    c: *b
  tree: |
    +STR
     +DOC
      +MAP
       =VAL :c
       =VAL :!y
      -MAP
     -DOC
    -STR
  json: |
    {"c": "!y"}
