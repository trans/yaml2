---
- name: 'A word holds past ... with no %YAML 2.0 line'
  from: part 1, section 4.4
  tags: directive quotes ending
  yaml: |
    %YAML 2.0 quotes
    ---
    a: "1"
    ...
    ---
    b: "1"
  tree: |
    +STR
     +DOC
      +MAP
       =VAL :a
       =VAL "1
      -MAP
     -DOC
     +DOC
      +MAP
       =VAL :b
       =VAL "1
      -MAP
     -DOC
    -STR
  json: |
    {"a": "1"}
    {"b": "1"}
