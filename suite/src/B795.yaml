---
- name: A merge inside a flow table
  from: part 1, section 8.4
  tags: table flow merge
  yaml: |
    %YAML 2.0
    --- &
    {a: {p: 1}, b: {<<: *a, q: 2}}
    ---
    c: *b
  tree: |
    +STR
     +DOC
      +MAP
       =VAL :c
       +MAP
        =VAL :p
        =VAL :1
        =VAL :q
        =VAL :2
       -MAP
      -MAP
     -DOC
    -STR
  json: |
    {"c": {"p": "1", "q": "2"}}
