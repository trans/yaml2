---
- name: '<...> names an entry with a space in it'
  from: part 1, section 8.2
  tags: reference
  yaml: |
    %YAML 2.0
    --- &
    "my key": {x: 1}
    ---
    a: *<my key>:x
    b: [*<my key>:x, 1]
  tree: |
    +STR
     +DOC
      +MAP
       =VAL :a
       =VAL :1
       =VAL :b
       +SEQ
        =VAL :1
        =VAL :1
       -SEQ
      -MAP
     -DOC
    -STR
  json: |
    {"a": "1", "b": ["1", "1"]}
